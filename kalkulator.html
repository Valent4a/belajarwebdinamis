<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentino Fausta</title>
    <link rel="stylesheet" href="style kalkulator.css">
</head>
<body>

    <div class="card">
        <h2>Kalkulator Diskon Belanja</h2>
        <p class="subtitle">Masukkan total belanja Anda untuk mengecek diskon</p>

        <div class="form-group">
            <label for="nominal">Total Nominal Belanja (Rp)</label>
            <input 
                type="number" 
                id="nominal" 
                placeholder="Masukan nominal" 
                min="0"
            >
        </div>

        <button id="btnCek" onclick="prosesDiskon()">Cek Diskon</button>

        <div id="hasil"></div>
    </div>
    <script src="script kalkulator.js"></script>
</body>
</html>
